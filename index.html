<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Arcade Loader</title>
<style>
html, body { margin:0; padding:0; height:100%; background:#140a24; color:#f2e9ff;
  font-family:-apple-system, "Helvetica Neue", Arial, sans-serif;
  -webkit-user-select:none; user-select:none; overflow:hidden; }
#menu { position:absolute; top:0; left:0; right:0; bottom:0; display:flex;
  flex-direction:column; align-items:center; justify-content:center;
  padding:24px; box-sizing:border-box; text-align:center; }
.marquee { font-family:Impact, "Arial Black", sans-serif; font-size:46px; letter-spacing:2px;
  color:#ffe45c; margin:0 0 8px;
  text-shadow:0 0 6px #ff3fa4, 0 0 18px #ff3fa4, 0 0 40px #7a1fff; }
.sub { color:#b9a6d9; font-size:15px; line-height:1.45; margin:0 0 28px; max-width:320px; }
.coin { display:block; width:100%; max-width:320px; padding:18px; font-size:20px; font-weight:bold;
  color:#140a24; background:#ffe45c; border:0; border-radius:14px; margin-bottom:22px;
  box-shadow:0 6px 0 #b8901a, 0 0 24px #ffe45c; -webkit-tap-highlight-color:transparent; }
.coin:active { -webkit-transform:translateY(4px); transform:translateY(4px); box-shadow:0 2px 0 #b8901a; }
.opt { display:block; font-size:14px; color:#b9a6d9; margin-bottom:6px; }
select { width:100%; max-width:320px; font-size:16px; padding:10px; border-radius:10px;
  border:2px solid #4b2d7a; background:#22123b; color:#f2e9ff; }
#status { margin-top:18px; min-height:20px; font-size:14px; color:#5cf2ff; max-width:320px; line-height:1.4; }
#stage { display:none; position:absolute; top:0; left:0; right:0; bottom:0; background:#000000; }
#game { width:100%; height:100%; }
#exit { position:absolute; top:12px; left:12px; z-index:99999; padding:8px 14px; font-size:14px;
  font-weight:bold; color:#f2e9ff; background:#22123b; border:2px solid #ff3fa4; border-radius:10px; }
#rom { display:none; }
</style>
</head>
<body>

<div id="menu">
  <h1 class="marquee">ARCADE</h1>
  <p class="sub">Pick an arcade romset (.zip) or NES game (.nes). Keep the zip named exactly as the romset, like galaga.zip.</p>
  <button class="coin" id="pick">Insert coin (choose ROM)</button>
  <label class="opt" for="core">Emulator core</label>
  <select id="core">
    <option value="mame2003_plus">MAME 2003-Plus (most games)</option>
    <option value="mame2003">MAME 2003 (0.78 romsets)</option>
    <option value="fbneo">FinalBurn Neo (Neo Geo, Capcom)</option>
    <option value="nes">NES (.nes homebrew)</option>
  </select>
  <div id="status"></div>
  <input type="file" id="rom" accept=".zip,.7z,.nes,application/zip">
</div>

<div id="stage">
  <button id="exit">Exit</button>
  <div id="game"></div>
</div>

<script>
/* Pinned so the emulator can't change underneath us; 'stable' is only a fallback */
var CDNS = ['https://cdn.emulatorjs.org/4.2.3/data/', 'https://cdn.emulatorjs.org/stable/data/'];
var fileInput = document.getElementById('rom');

/* iOS kills the page without warning when it runs out of memory, so we leave a
   heartbeat while playing. If it is still there on the next launch, the last
   game was killed rather than exited, and we say how long it lasted. */
var HEARTBEAT = 'arcader_heartbeat';
function readHeartbeat() {
  try { return JSON.parse(localStorage.getItem(HEARTBEAT)); } catch (e) { return null; }
}
function writeHeartbeat(hb) {
  try {
    if (hb) { localStorage.setItem(HEARTBEAT, JSON.stringify(hb)); }
    else { localStorage.removeItem(HEARTBEAT); }
  } catch (e) {}
}

function setStatus(msg) {
  document.getElementById('status').innerHTML = msg;
}

document.getElementById('pick').onclick = function () {
  fileInput.value = '';
  fileInput.click();
};

var lastRun = readHeartbeat();
writeHeartbeat(null);
if (lastRun && lastRun.game) {
  var secs = Math.round((lastRun.last - lastRun.start) / 1000);
  setStatus('Last game (' + lastRun.game + ', ' + lastRun.core + ') stopped without Exit after about ' +
    (secs >= 60 ? Math.floor(secs / 60) + ' min ' + (secs % 60) + ' s' : secs + ' s') +
    '. If you did not close it yourself, iOS most likely ran out of memory.');
}

fileInput.onchange = function () {
  var f = fileInput.files && fileInput.files[0];
  if (!f) { return; }
  if (/\.nes$/i.test(f.name)) {
    document.getElementById('core').value = 'nes';
  } else if (!/\.(zip|7z)$/i.test(f.name)) {
    setStatus('Choose a .zip arcade romset or a .nes file.');
    return;
  }
  startGame(f);
};

function startGame(f) {
  var core = document.getElementById('core').value;
  var baseName = f.name.replace(/\.[^.]+$/, '');

  document.getElementById('menu').style.display = 'none';
  document.getElementById('stage').style.display = 'block';

  window.EJS_player = '#game';
  window.EJS_core = core;
  window.EJS_gameUrl = f;          /* File object keeps the original zip name */
  window.EJS_gameName = baseName;  /* MAME matches the game by this name */
  window.EJS_color = '#ff3fa4';
  window.EJS_backgroundColor = '#000000';
  /* Lighter settings to stay under iOS's memory limit. These are only defaults:
     anything changed in the emulator's own settings menu still wins. */
  window.EJS_defaultOptions = {
    'webgl2Enabled': 'disabled',   /* WebGL1 build of the core */
    'rewindEnabled': 'disabled',   /* rewind keeps snapshots in memory */
    'shader': 'disabled'
  };
  /* No auto-start: the tap on Play unlocks audio on iOS */

  var hb = { game: f.name, core: core, start: Date.now(), last: Date.now() };
  writeHeartbeat(hb);
  setInterval(function () { hb.last = Date.now(); writeHeartbeat(hb); }, 5000);

  loadEmulator(0);
}

function loadEmulator(i) {
  window.EJS_pathtodata = CDNS[i];
  var s = document.createElement('script');
  s.src = CDNS[i] + 'loader.js';
  s.onerror = function () {
    if (i + 1 < CDNS.length) { loadEmulator(i + 1); return; }
    writeHeartbeat(null);
    document.getElementById('stage').style.display = 'none';
    document.getElementById('menu').style.display = 'flex';
    setStatus('Could not reach the emulator files. Check your internet connection and try again.');
  };
  document.body.appendChild(s);
}

/* EmulatorJS cannot cleanly unload, so Exit reloads the page */
document.getElementById('exit').onclick = function () {
  writeHeartbeat(null);
  location.reload();
};
</script>

</body>
</html>
